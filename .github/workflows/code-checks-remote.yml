name: Code-Checks-Remote
on:
    push:
    #  branches-ignore:
    #   - master
    #   - main
    #   - develop
     paths-ignore:
      - README.md
      - .old_cicd/*
      # - .github/*
      # - .github/workflows/*
      - LICENSE
      - .gitignore
      - .dockerignore
      - .githooks
    pull_request:
     branches:
      - develop
      - master
      - main 
     types: [ opened, synchronize ]
          
# concurrency:
#   group: ${{ github.ref }}-${{ github.workflow }}
#   cancel-in-progress: true
#for test

jobs:
  code-checks:
    if: ${{ ! (github.event_name == 'push' && startsWith(github.ref, 'refs/pull/')) }}
    uses: pchachicho/renci-github-actions/.github/workflows/code-checks.yml@main
    secrets: inherit
